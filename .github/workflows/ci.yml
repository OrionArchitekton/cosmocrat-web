name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ENV: staging
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify presentation assets and site configuration
        run: node --test tests/presentation-assets.test.mjs tests/site-config.test.mjs

      - name: Build
        run: npm run build

      - name: Install the browser test driver
        run: |
          npm install --prefix "$RUNNER_TEMP/cosmocrat-browser" --no-audit --no-fund agent-browser@0.43.0
          echo "$RUNNER_TEMP/cosmocrat-browser/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify built pages, intake and browser interactions
        env:
          SITE_TEST_ORIGIN: http://127.0.0.1:3000
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/cosmocrat-site.log 2>&1 &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/tools > /dev/null; then break; fi
            sleep 1
          done
          node --test tests/*http.test.mjs tests/site-pages.test.mjs
          for suite in tests/*browser.test.py; do
            python3 "$suite"
          done
