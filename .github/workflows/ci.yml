name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ENV: staging
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify presentation assets
        run: node --test tests/presentation-assets.test.mjs

      - name: Build
        run: npm run build

      - name: Verify built catalog and reference documents
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/cosmocrat-site.log 2>&1 &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/tools > /dev/null; then break; fi
            sleep 1
          done
          SITE_TEST_ORIGIN=http://127.0.0.1:3000 node --test tests/*http.test.mjs
