<!doctype html><html lang="en"><meta charset="utf-8"><title>Cosmocrat OS motion source</title>
<style>@font-face{font-family:Inter;src:url('/fonts/inter-latin.woff2');font-weight:100 900}body{margin:0;background:#0b1120;display:grid;place-items:center;height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="film"></canvas><script>
const mobile=new URLSearchParams(location.search).has('mobile');
const W=mobile?1080:1920,H=mobile?1440:1080,D=22;
const canvas=document.querySelector('canvas');canvas.width=W;canvas.height=H;const c=canvas.getContext('2d');
const img=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
const assets=Promise.all([img('/brand/cosmocrat-wordmark.png'),img('/brand/cosmocrat-sigil.svg'),document.fonts.load('500 32px Inter')]);
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const fade=(t,a,b)=>ease((t-a)/b);const palette={bg:'#0b1120',gold:'#f0b66a',amber:'#d97706',ink:'#e2e8f0',muted:'#94a3b8'};
let wordmark,sigil;
function text(s,x,y,size=30,color=palette.ink,weight=450,align='center'){c.fillStyle=color;c.font=`${weight} ${size}px Inter`;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,alpha=1,width=1){c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.globalAlpha=1}
function background(t){c.globalAlpha=1;c.fillStyle=palette.bg;c.fillRect(0,0,W,H);const g=c.createRadialGradient(W*.51,H*.5,20,W*.51,H*.5,W*.62);g.addColorStop(0,'#253149');g.addColorStop(.48,'#121d30');g.addColorStop(1,'#0b1120');c.fillStyle=g;c.fillRect(0,0,W,H);for(let x=0;x<W;x+=72)line(x,0,x,H,'#455477',.065);for(let y=0;y<H;y+=72)line(0,y,W,y,'#455477',.065);for(let n=0;n<36;n++){const x=(n*317+Math.sin(t*.13+n)*20)%W,y=(n*163+Math.cos(t*.16+n)*14)%H;c.fillStyle=n%5===0?'#d9a96c':'#7587aa';c.globalAlpha=.1+.12*Math.sin(t*.4+n)**2;c.beginPath();c.arc(x,y,n%5===0?1.6:1,0,Math.PI*2);c.fill()}c.globalAlpha=1}
const groups=[
 [{name:'Orion PM',role:'OWN THE WORK'},{name:'Orion Browser',role:'BROWSER ACCESS'},{name:'Orion Phone',role:'PHONE ACCESS'},{name:'Orion Handoff',role:'CARRY CONTEXT'},{name:'Orion Results',role:'RECOVER RESULTS'},{name:'Orion Worktree Report',role:'INSPECT EDITS'}],
 [{name:'Orion Starter',role:'COMPOSE A WORKFLOW',status:'PREVIEW'},{name:'failclosed',role:'CHECK REVIEW EVIDENCE'},{name:'Orion Skills',role:'OPERATING PRACTICES'},{name:'Remote Hands',role:'START A SESSION',status:'EXPERIMENTAL'}]
];
function positions(n){if(mobile){return n===6?[[260,350],[820,350],[210,670],[870,670],[280,1000],[800,1000]]:[[250,390],[830,390],[250,1000],[830,1000]]}return n===6?[[430,310],[1490,310],[310,550],[1610,550],[440,800],[1480,800]]:[[430,340],[1490,340],[430,770],[1490,770]]}
function glyph(type,x,y){c.strokeStyle=palette.gold;c.lineWidth=2;c.beginPath();if(type===0){c.roundRect(x-10,y-12,20,24,3);c.moveTo(x-5,y-3);c.lineTo(x+5,y-3);c.moveTo(x-5,y+4);c.lineTo(x+3,y+4)}else if(type===1){c.roundRect(x-13,y-10,26,20,3);c.moveTo(x-13,y-3);c.lineTo(x+13,y-3)}else if(type===2){c.roundRect(x-8,y-14,16,28,4);c.moveTo(x-3,y+9);c.lineTo(x+3,y+9)}else{c.moveTo(x-12,y);c.lineTo(x+12,y);c.moveTo(x+5,y-7);c.lineTo(x+12,y);c.lineTo(x+5,y+7);c.moveTo(x-5,y-7);c.lineTo(x-12,y);c.lineTo(x-5,y+7)}c.stroke()}
function node(item,x,y,p,idx,center){if(p<=0)return;const r=mobile?29:25;const yy=y+(1-ease(p))*26;c.save();c.globalAlpha=clamp(p);const dx=x-center[0],dy=yy-center[1],len=Math.hypot(dx,dy),q=ease(p);c.strokeStyle='#ac7846';c.lineWidth=1.4;c.setLineDash([5,8]);c.beginPath();c.moveTo(center[0]+dx*.18,center[1]+dy*.18);c.lineTo(center[0]+dx*q,center[1]+dy*q);c.stroke();c.setLineDash([]);c.fillStyle='#111e31';c.strokeStyle='#b07a41';c.lineWidth=1.2;c.beginPath();c.arc(x,yy,r,0,Math.PI*2);c.fill();c.stroke();glyph(idx%4,x,yy);text(item.role,x,yy+62,mobile?26:17,palette.gold,500);text(item.name,x,yy+98,mobile?36:29,palette.ink,550);if(item.status)text(item.status,x,yy+137,mobile?24:15,palette.gold,450);c.restore()}
function central(t,a=1,scale=1){const x=W/2,y=mobile?660:535;c.save();c.globalAlpha=a;c.translate(x,y);c.scale(scale,scale);for(let k=0;k<3;k++){c.strokeStyle=`rgba(211,151,82,${.19-k*.04})`;c.lineWidth=1;c.beginPath();c.ellipse(0,0,(mobile?142:175)+k*28,(mobile?142:175)+k*28,0,0,Math.PI*2);c.stroke()}c.shadowColor='#d99539';c.shadowBlur=22;c.drawImage(sigil,-(mobile?91:110),-(mobile?106:130),mobile?182:220,mobile?212:260);c.shadowBlur=0;c.restore()}
function brandTitle(y,subtitle,alpha=1){c.save();c.globalAlpha=alpha;const w=mobile?720:880;c.drawImage(wordmark,(W-w)/2,y,w,w*74/604);text('O S',W/2,y+(mobile?138:148),mobile?31:31,palette.gold,400);text(subtitle,W/2,y+(mobile?224:235),mobile?32:38,palette.ink,450);c.restore()}
function render(t){background(t);central(t,fade(t,0,.9),1.45-.45*fade(t,3,1)-.2*fade(t,17,1));const intro=1-fade(t,3,1);if(intro>0){brandTitle(mobile?925:810,'Human-directed AI work.',intro*fade(t,.5,1))}
const graph=fade(t,3,1)*(1-fade(t,17,1));if(graph>0){c.save();c.globalAlpha=graph;const w=mobile?480:510;c.drawImage(wordmark,(W-w)/2,mobile?75:65,w,w*74/604);text('COSMOCRAT OS',W/2,mobile?176:155,19,palette.gold,500);text(t<10?'Give the work a way to continue.':'Put useful pieces together.',W/2,mobile?240:210,mobile?42:35,palette.ink,450);c.restore();text('HUMAN DIRECTION',W/2,mobile?850:745,mobile?17:16,palette.gold,500);const group=t<10?0:1,local=t-(group?10:3.2),pts=positions(groups[group].length);for(let i=0;i<pts.length;i++)node(groups[group][i],...pts[i],graph*(group===0?1-fade(t,9.3,.7):1)*fade(local,i*.3,.7),i,[W/2,mobile?660:535]);text('Independent releases · Selected previews',W/2,H-70,mobile?28:23,palette.muted,400)}
const close=fade(t,17,1);if(close>0){brandTitle(mobile?185:180,'Start with the tool you need.',close);text('Keep the evidence. Check the work again.',W/2,mobile?1110:875,mobile?28:30,palette.muted,400);text('EXPLORE COSMOCRAT OS',W/2,H-(mobile?170:105),mobile?23:23,palette.gold,500)}
}
window.renderFrame=render;window.captureDone=false;
window.ready=assets.then(([w,s])=>{wordmark=w;sigil=s;render(1.5);return true});
window.record=async()=>{await window.ready;window.captureDone=false;render(0);const stream=canvas.captureStream(30);const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:mobile?2400000:3000000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const saved=new Promise((resolve,reject)=>{recorder.onstop=async()=>{try{const blob=new Blob(chunks,{type:'video/webm'});const response=await fetch('/save/'+(mobile?'mobile':'desktop')+'.webm',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});if(!response.ok)throw Error('Save refused');window.captureDone=true;resolve(blob.size)}catch(e){reject(e)}}});recorder.start();const start=performance.now();await new Promise(resolve=>{function next(){const t=(performance.now()-start)/1000;render(Math.min(t,D));if(t<D)requestAnimationFrame(next);else resolve()}requestAnimationFrame(next)});recorder.stop();stream.getTracks().forEach(t=>t.stop());return saved};
</script></html>
